name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一个 PR 连续推送时取消上一轮，避免排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + testDebugUnitTest + lintDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # AGP 8.6 要求 settings.gradle.kts 里的 pluginManagement / dependencyResolutionManagement
      # 包含 Google + Maven Central，缺了会直接解析失败
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            ~/.gradle/caches
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug