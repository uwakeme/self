<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style id="theme-vars">
:root {
  /* ── Brand Colors — Warm Journal Palette ── */
  --color-primary: #C4785B;
  --color-primary-light: #D99B82;
  --color-primary-lighter: #EBC8B8;
  --color-primary-lightest: #F5E6DD;
  --color-primary-dark: #A65D42;
  --color-primary-darker: #8B4A33;

  --color-bg: #FBF7F3;
  --color-bg-warm: #F7F0E8;
  --color-bg-card: #FFFFFF;
  --color-bg-card-alt: #FDF9F5;
  --color-bg-surface: #F5EDE4;
  --color-bg-overlay: rgba(139, 74, 51, 0.08);

  --color-text: #3D2B1F;
  --color-text-secondary: #7A6558;
  --color-text-tertiary: #A89585;
  --color-text-inverse: #FFFFFF;

  --color-border: #E8DDD3;
  --color-border-light: #F0E8DF;
  --color-divider: #EDE5DC;

  /* ── State Colors ── */
  --state-success: #6B9E78;
  --state-warning: #D4A24E;
  --state-error: #C45B5B;
  --state-info: #6B8EAE;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography ── */
  --font-display: 'Georgia', 'Noto Serif SC', serif;
  --font-body: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  --text-xs: 0.6875rem;
  --text-sm: 0.8125rem;
  --text-base: 0.9375rem;
  --text-lg: 1.0625rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;

  --leading-tight: 1.3;
  --leading-normal: 1.6;
  --leading-relaxed: 1.75;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ── Shadows (restrained) ── */
  --shadow-sm: 0 1px 2px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.05);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.05);

  /* ── Typography Classes ── */
  .font-display { font-family: var(--font-display); }
  .font-body { font-family: var(--font-body); }
}

.dark {
  --color-primary: #D99B82;
  --color-primary-light: #EBC8B8;
  --color-primary-lighter: #F5E6DD;
  --color-primary-lightest: #3D2B1F;
  --color-primary-dark: #C4785B;
  --color-primary-darker: #A65D42;

  --color-bg: #1A1410;
  --color-bg-warm: #231C15;
  --color-bg-card: #2A221A;
  --color-bg-card-alt: #241E16;
  --color-bg-surface: #1F1912;
  --color-bg-overlay: rgba(217, 155, 130, 0.1);

  --color-text: #F0E8DF;
  --color-text-secondary: #B8A99A;
  --color-text-tertiary: #8A7B6C;
  --color-text-inverse: #3D2B1F;

  --color-border: #3D3228;
  --color-border-light: #332A22;
  --color-divider: #382E25;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.15);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.18);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.2);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-bg);
    --color-foreground: var(--color-text);
    --color-card: var(--color-bg-card);
    --color-card-foreground: var(--color-text);
    --color-border: var(--color-border);
    --color-ring: var(--color-primary);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="max-width: 375px; margin: 0 auto; padding-bottom: 80px; background: var(--color-bg); color: var(--color-text);">

    <main>

      <!-- 1. Personalized Greeting Header -->
      <header style="background: linear-gradient(to bottom, var(--color-primary-lightest), var(--color-bg)); padding: var(--space-8) var(--space-5) var(--space-6); position: relative;">
        <h1 class="font-display" style="font-size: var(--text-xl); color: var(--color-text); margin: 0 0 var(--space-2); text-wrap: balance; word-break: keep-all;">下午好，小暖</h1>
        <p style="font-family: var(--font-body); font-size: var(--text-sm); color: var(--color-text-secondary); margin: 0; font-style: italic; letter-spacing: 0.02em;">今天是个记录好日子</p>
        <div style="position: absolute; right: var(--space-5); bottom: -20px; width: 40px; height: 40px; border-radius: var(--radius-full); border: 2px solid var(--color-bg); overflow: hidden; background: var(--color-bg-surface); box-shadow: var(--shadow-sm);">
          <img src="../assets/avatar-placeholder.jpg" alt="小暖的头像" width="40" height="40" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        </div>
      </header>

      <!-- 3. Quick Actions (快捷操作) -->
      <section style="margin: 0 var(--space-5) var(--space-5);">
        <div style="background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5);">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4);">
            <h3 class="font-display" style="font-size: var(--text-lg); color: var(--color-text); margin: 0; text-wrap: balance; word-break: keep-all;">快捷操作</h3>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
          </div>
          <div style="display: flex; gap: var(--space-3); overflow-x: auto;" class="no-scrollbar">
            <!-- 随想笔记 -->
            <a href="self-detail.html" class="home-link quick-action-item" style="display: flex; flex-direction: column; align-items: center; gap: var(--space-2); min-width: 68px; flex: 1; padding: var(--space-4) var(--space-2); background: var(--color-bg-warm); border-radius: var(--radius-lg); text-decoration: none; cursor: pointer; transition: all 0.2s ease; border: 1px solid var(--color-border-light);">
              <div style="width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--color-primary-lightest); display: flex; align-items: center; justify-content: center;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              </div>
              <span class="font-body" style="font-size: var(--text-sm); font-weight: 500; color: var(--color-text); white-space: nowrap;">写笔记</span>
            </a>
            <!-- 新增人物 -->
            <a href="people-gallery.html" class="home-link quick-action-item" style="display: flex; flex-direction: column; align-items: center; gap: var(--space-2); min-width: 68px; flex: 1; padding: var(--space-4) var(--space-2); background: #EBF0F5; border-radius: var(--radius-lg); text-decoration: none; cursor: pointer; transition: all 0.2s ease; border: 1px solid #E0E8F0;">
              <div style="width: 40px; height: 40px; border-radius: var(--radius-full); background: #DAE4EF; display: flex; align-items: center; justify-content: center;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--state-info)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
              </div>
              <span class="font-body" style="font-size: var(--text-sm); font-weight: 500; color: var(--color-text); white-space: nowrap;">加人物</span>
            </a>
            <!-- 添加纪念日 -->
            <a href="self-detail.html" class="home-link quick-action-item" style="display: flex; flex-direction: column; align-items: center; gap: var(--space-2); min-width: 68px; flex: 1; padding: var(--space-4) var(--space-2); background: #E8F2EB; border-radius: var(--radius-lg); text-decoration: none; cursor: pointer; transition: all 0.2s ease; border: 1px solid #D8E8DD;">
              <div style="width: 40px; height: 40px; border-radius: var(--radius-full); background: #D5E8DA; display: flex; align-items: center; justify-content: center;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--state-success)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </div>
              <span class="font-body" style="font-size: var(--text-sm); font-weight: 500; color: var(--color-text); white-space: nowrap;">纪念日</span>
            </a>
            <!-- 设置提醒 -->
            <a href="settings.html" class="home-link quick-action-item" style="display: flex; flex-direction: column; align-items: center; gap: var(--space-2); min-width: 68px; flex: 1; padding: var(--space-4) var(--space-2); background: #FDF3E0; border-radius: var(--radius-lg); text-decoration: none; cursor: pointer; transition: all 0.2s ease; border: 1px solid #F5E6CC;">
              <div style="width: 40px; height: 40px; border-radius: var(--radius-full); background: #F8E5C8; display: flex; align-items: center; justify-content: center;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--state-warning)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              </div>
              <span class="font-body" style="font-size: var(--text-sm); font-weight: 500; color: var(--color-text); white-space: nowrap;">提醒</span>
            </a>
          </div>
        </div>
      </section>

      <!-- 4. Upcoming Reminders Card (近期提醒) -->
      <section style="margin: 0 var(--space-5) var(--space-4);">
        <div style="background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5);">
          <!-- Title row -->
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4);">
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <h3 class="font-display" style="font-size: var(--text-lg); color: var(--color-text); margin: 0; text-wrap: balance; word-break: keep-all;">近期提醒</h3>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <a href="settings.html" class="home-link" style="font-family: var(--font-body); font-size: var(--text-xs); color: var(--color-primary); text-decoration: none;">查看全部</a>
          </div>

          <!-- Reminder Item 1 -->
          <div style="display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0;">
            <div style="width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--color-primary-lightest); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <span style="font-family: var(--font-display); font-size: var(--text-base); color: var(--color-primary-dark); font-weight: 600;">妈</span>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-family: var(--font-body); font-size: var(--text-sm); color: var(--color-text); font-weight: 600;">妈妈的生日</div>
              <div style="font-family: var(--font-body); font-size: var(--text-xs); color: var(--color-text-tertiary);">3月15日 · 还有12天</div>
            </div>
            <div style="width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--color-primary-lightest); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
          </div>

          <!-- Divider -->
          <div style="height: 1px; background: var(--color-divider);"></div>

          <!-- Reminder Item 2 -->
          <div style="display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0;">
            <div style="width: 40px; height: 40px; border-radius: var(--radius-full); background: #EBF0F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <span style="font-family: var(--font-display); font-size: var(--text-base); color: var(--state-info); font-weight: 600;">林</span>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-family: var(--font-body); font-size: var(--text-sm); color: var(--color-text); font-weight: 600;">认识纪念日</div>
              <div style="font-family: var(--font-body); font-size: var(--text-xs); color: var(--color-text-tertiary);">6月20日 · 还有28天</div>
            </div>
            <div style="width: 28px; height: 28px; border-radius: var(--radius-full); background: #EBF0F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--state-info)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
          </div>

        </div>
      </section>

      <!-- 4. Relationship Summary Card (关系概览) -->
      <section style="margin: 0 var(--space-5) var(--space-4);">
        <div style="background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5);">
          <!-- Title row -->
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4);">
            <div>
              <h3 class="font-display" style="font-size: var(--text-lg); color: var(--color-text); margin: 0 0 2px; text-wrap: balance; word-break: keep-all;">我的人际关系</h3>
              <span class="font-body" style="font-size: var(--text-xs); color: var(--color-text-tertiary);">6位重要的人</span>
            </div>
            <a href="relationship-map.html" class="home-link" style="font-family: var(--font-body); font-size: var(--text-xs); color: var(--color-primary); text-decoration: none;">查看图谱 ></a>
          </div>

          <!-- Avatar row -->
          <div style="display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-4); padding: var(--space-2) 0;">
            <!-- 我 -->
            <div style="width: 32px; height: 32px; border-radius: var(--radius-full); border: 2px solid var(--color-primary); background: var(--color-bg-card); display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 6;">
              <span style="font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-primary); font-weight: 600;">我</span>
            </div>
            <!-- 妈 -->
            <div style="width: 32px; height: 32px; border-radius: var(--radius-full); border: 2px solid var(--color-bg-card); background: var(--color-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: -8px; z-index: 5;">
              <span style="font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-inverse); font-weight: 600;">妈</span>
            </div>
            <!-- 姐 -->
            <div style="width: 32px; height: 32px; border-radius: var(--radius-full); border: 2px solid var(--color-bg-card); background: var(--color-primary-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: -8px; z-index: 4;">
              <span style="font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-inverse); font-weight: 600;">姐</span>
            </div>
            <!-- 林 -->
            <div style="width: 32px; height: 32px; border-radius: var(--radius-full); border: 2px solid var(--color-bg-card); background: var(--state-info); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: -8px; z-index: 3;">
              <span style="font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-inverse); font-weight: 600;">林</span>
            </div>
            <!-- 杰 -->
            <div style="width: 32px; height: 32px; border-radius: var(--radius-full); border: 2px solid var(--color-bg-card); background: var(--state-info); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: -8px; z-index: 2;">
              <span style="font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-inverse); font-weight: 600;">杰</span>
            </div>
            <!-- 师 -->
            <div style="width: 32px; height: 32px; border-radius: var(--radius-full); border: 2px solid var(--color-bg-card); background: var(--state-success); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: -8px; z-index: 1;">
              <span style="font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-inverse); font-weight: 600;">师</span>
            </div>
          </div>

          <!-- Category summary -->
          <div style="text-align: center;">
            <span class="font-body" style="font-size: var(--text-xs); color: var(--color-text-tertiary);">
              <span style="display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-primary); margin-right: 3px; vertical-align: middle;"></span>家人 2
              <span style="margin: 0 var(--space-2);">·</span>
              <span style="display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--state-info); margin-right: 3px; vertical-align: middle;"></span>朋友 2
              <span style="margin: 0 var(--space-2);">·</span>
              <span style="display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--state-warning); margin-right: 3px; vertical-align: middle;"></span>同事 1
              <span style="margin: 0 var(--space-2);">·</span>
              <span style="display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--state-success); margin-right: 3px; vertical-align: middle;"></span>同学 1
            </span>
          </div>

        </div>
      </section>

      <!-- 6. Today's Tip / Mood (今日寄语) -->
      <section style="margin: 0 var(--space-5) var(--space-4);">
        <div style="background: var(--color-primary-lightest); border: 1px solid var(--color-primary-lighter); border-radius: var(--radius-lg); padding: var(--space-5); position: relative;">
          <!-- Decorative quotation mark -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--color-primary-light)" style="position: absolute; top: var(--space-5); left: var(--space-5);">
            <path d="M11 7H7a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2v2a2 2 0 0 1-2 2H7v-2H5v2a4 4 0 0 0 4 4h2V7zm10 0h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2v2a2 2 0 0 1-2 2h-1v-2h-2v2a4 4 0 0 0 4 4h2V7z"/>
          </svg>
          <div style="padding-top: var(--space-3);">
            <p class="font-display" style="font-size: var(--text-base); color: var(--color-text-secondary); font-style: italic; margin: 0 0 var(--space-3); line-height: var(--leading-relaxed); text-wrap: balance; word-break: keep-all;">认识自己，是一切智慧的开端。</p>
            <p style="font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-tertiary); margin: 0 0 var(--space-4); text-align: right;">— Aristotle</p>
            <p class="font-body" style="font-size: var(--text-xs); color: var(--color-text-tertiary); margin: 0; line-height: var(--leading-normal);">记录每一天的感受，让成长有迹可循</p>
          </div>
        </div>
      </section>

    </main>

    <!-- Bottom Tab Bar (shared partial) -->
    <style>
      .tab-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-4);
        height: 56px;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        background: var(--color-bg-card);
        border-top: 1px solid var(--color-border);
        box-shadow: 0 -1px 4px rgba(61, 43, 31, 0.04);
      }

      .tab-item {
        display: flex;
        flex-direction: column;
        align-items: center;
