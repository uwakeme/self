<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关系图谱</title>
    <style id="theme-vars">
:root {
  /* ── Brand Colors — Warm Journal Palette ── */
  --color-primary: #C4785B;
  --color-primary-light: #D99B82;
  --color-primary-lighter: #EBC8B8;
  --color-primary-lightest: #F5E6DD;
  --color-primary-dark: #A65D42;
  --color-primary-darker: #8B4A33;

  --color-bg: #FBF7F3;
  --color-bg-warm: #F7F0E8;
  --color-bg-card: #FFFFFF;
  --color-bg-card-alt: #FDF9F5;
  --color-bg-surface: #F5EDE4;
  --color-bg-overlay: rgba(139, 74, 51, 0.08);

  --color-text: #3D2B1F;
  --color-text-secondary: #7A6558;
  --color-text-tertiary: #A89585;
  --color-text-inverse: #FFFFFF;

  --color-border: #E8DDD3;
  --color-border-light: #F0E8DF;
  --color-divider: #EDE5DC;

  /* ── State Colors ── */
  --state-success: #6B9E78;
  --state-warning: #D4A24E;
  --state-error: #C45B5B;
  --state-info: #6B8EAE;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography ── */
  --font-display: 'Georgia', 'Noto Serif SC', serif;
  --font-body: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  --text-xs: 0.6875rem;
  --text-sm: 0.8125rem;
  --text-base: 0.9375rem;
  --text-lg: 1.0625rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;

  --leading-tight: 1.3;
  --leading-normal: 1.6;
  --leading-relaxed: 1.75;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ── Shadows (restrained) ── */
  --shadow-sm: 0 1px 2px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.05);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.05);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-bg);
    --color-foreground: var(--color-text);
    --color-border: var(--color-border);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-text-inverse);
    --color-muted: var(--color-bg-surface);
    --color-muted-foreground: var(--color-text-secondary);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text); }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body style="max-width: 375px; margin: 0 auto; padding-bottom: 80px; background: var(--color-bg); color: var(--color-text);">

  <!-- Header -->
  <header style="background: linear-gradient(to bottom, var(--color-primary-lightest), var(--color-bg)); padding: var(--space-6) var(--space-5) var(--space-8); text-align: center;">
    <h1 style="font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 600; color: var(--color-text); margin: 0 0 var(--space-2); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight);">关系图谱</h1>
    <p style="font-family: var(--font-body); font-size: var(--text-sm); color: var(--color-text-secondary); margin: 0; line-height: var(--leading-normal);">看见人与人之间的联结</p>
  </header>

  <!-- Relationship Type Legend -->
  <section style="display: flex; align-items: center; justify-content: center; gap: var(--space-4); padding: 0 var(--space-5) var(--space-5); overflow-x: auto;" class="no-scrollbar">
    <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--color-primary); display: inline-block;"></span>
      <span style="font-size: var(--text-sm); color: var(--color-text-secondary); font-family: var(--font-body);">家人</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--state-info); display: inline-block;"></span>
      <span style="font-size: var(--text-sm); color: var(--color-text-secondary); font-family: var(--font-body);">朋友</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--state-success); display: inline-block;"></span>
      <span style="font-size: var(--text-sm); color: var(--color-text-secondary); font-family: var(--font-body);">同事</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--state-warning); display: inline-block;"></span>
      <span style="font-size: var(--text-sm); color: var(--color-text-secondary); font-family: var(--font-body);">同学</span>
    </div>
  </section>

  <!-- SVG Relationship Graph -->
  <section style="padding: 0 var(--space-5) var(--space-6);">
    <svg width="100%" viewBox="0 0 340 400" xmlns="http://www.w3.org/2000/svg" style="display: block;">
      <defs>
        <!-- Radial gradient background -->
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#F5E6DD" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#FBF7F3" stop-opacity="0"/>
        </radialGradient>

        <!-- Drop shadow for center node -->
        <filter id="shadowCenter" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#C4785B" flood-opacity="0.25"/>
        </filter>

        <!-- Drop shadow for outer nodes -->
        <filter id="shadowNode" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#3D2B1F" flood-opacity="0.1"/>
        </filter>

        <!-- Glow for center node -->
        <filter id="glowCenter" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feFlood flood-color="#C4785B" flood-opacity="0.15" result="color"/>
          <feComposite in="color" in2="blur" operator="in" result="glow"/>
          <feMerge>
            <feMergeNode in="glow"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Background -->
      <rect width="340" height="400" fill="url(#bgGrad)" rx="var(--radius-lg)"/>

      <!-- Decorative orbit circles (3 tiers: 家人/朋友/其他) -->
      <circle cx="170" cy="200" r="85" fill="none" stroke="#E8DDD3" stroke-width="0.5" stroke-dasharray="2 8" opacity="0.25"/>
      <circle cx="170" cy="200" r="128" fill="none" stroke="#E8DDD3" stroke-width="0.5" stroke-dasharray="4 6" opacity="0.3"/>
      <circle cx="170" cy="200" r="153" fill="none" stroke="#E8DDD3" stroke-width="0.5" stroke-dasharray="3 7" opacity="0.2"/>

      <!-- Connection lines — distance from center reflects closeness, line weight reinforces it -->

      <!-- 妈妈 (170,130) — 家人 closest — dist≈70 -->
      <path d="M170,168 Q170,161 170,154" fill="none" stroke="#C4785B" stroke-width="2.5" opacity="0.5"/>
      <circle cx="170" cy="161" r="3" fill="#C4785B" opacity="0.35"/>

      <!-- 姐姐 (90,140) — 家人 close — dist≈100 -->
      <path d="M144,181 Q127,168 109,154" fill="none" stroke="#C4785B" stroke-width="2.5" opacity="0.5"/>
      <circle cx="127" cy="168" r="3" fill="#C4785B" opacity="0.35"/>

      <!-- 小林 (58,248) — 朋友 medium — dist≈122 -->
      <path d="M141,213 Q111,226 80,239" fill="none" stroke="#6B8EAE" stroke-width="2" opacity="0.35" stroke-dasharray="6 4"/>
      <circle cx="111" cy="226" r="2.5" fill="#6B8EAE" opacity="0.3"/>

      <!-- 张老师 (280,120) — 同事 far — dist≈136 -->
      <path d="M196,181 Q229,158 261,134" fill="none" stroke="#6B9E78" stroke-width="1.5" opacity="0.3" stroke-dasharray="3 5"/>
      <circle cx="229" cy="158" r="2" fill="#6B9E78" opacity="0.25"/>

      <!-- 阿杰 (108,335) — 朋友 farther — dist≈149 -->
      <path d="M157,229 Q138,271 118,313" fill="none" stroke="#6B8EAE" stroke-width="2" opacity="0.3" stroke-dasharray="6 4"/>
      <circle cx="138" cy="271" r="2.5" fill="#6B8EAE" opacity="0.25"/>

      <!-- 小李 (290,300) — 同学 farthest — dist≈156 -->
      <path d="M195,220 Q234,253 272,285" fill="none" stroke="#D4A24E" stroke-width="1.5" opacity="0.25" stroke-dasharray="3 5"/>
      <circle cx="234" cy="253" r="2" fill="#D4A24E" opacity="0.2"/>

      <!-- Center node "我" -->
      <circle class="graph-center-node" cx="170" cy="200" r="32" fill="#C4785B" filter="url(#glowCenter)" style="animation: pulse 3s ease-in-out infinite;"/>
      <text x="170" y="200" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="Georgia, 'Noto Serif SC', serif" font-size="16" font-weight="600">我</text>

      <!-- Outer node: 妈妈 (170, 130) — 家人 closest -->
      <circle class="graph-node" cx="170" cy="130" r="24" fill="#C4785B" filter="url(#shadowNode)"/>
      <text x="170" y="130" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" font-weight="500">妈</text>
      <text x="170" y="166" text-anchor="middle" fill="#7A6558" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11">妈妈</text>

      <!-- Outer node: 姐姐 (90, 140) — 家人 close -->
      <circle class="graph-node" cx="90" cy="140" r="24" fill="#C4785B" filter="url(#shadowNode)"/>
      <text x="90" y="140" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" font-weight="500">姐</text>
      <text x="90" y="176" text-anchor="middle" fill="#7A6558" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11">姐姐</text>

      <!-- Outer node: 小林 (58, 248) — 朋友 medium -->
      <circle class="graph-node" cx="58" cy="248" r="24" fill="#6B8EAE" filter="url(#shadowNode)"/>
      <text x="58" y="248" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" font-weight="500">林</text>
      <text x="58" y="284" text-anchor="middle" fill="#7A6558" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11">小林</text>

      <!-- Outer node: 阿杰 (108, 335) — 朋友 farther -->
      <circle class="graph-node" cx="108" cy="335" r="24" fill="#6B8EAE" filter="url(#shadowNode)"/>
      <text x="108" y="335" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" font-weight="500">杰</text>
      <text x="108" y="371" text-anchor="middle" fill="#7A6558" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11">阿杰</text>

      <!-- Outer node: 张老师 (280, 120) — 同事 far -->
      <circle class="graph-node" cx="280" cy="120" r="24" fill="#6B9E78" filter="url(#shadowNode)"/>
      <text x="280" y="120" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" font-weight="500">张</text>
      <text x="280" y="156" text-anchor="middle" fill="#7A6558" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11">张老师</text>

      <!-- Outer node: 小李 (290, 300) — 同学 farthest -->
      <circle class="graph-node" cx="290" cy="300" r="24" fill="#D4A24E" filter="url(#shadowNode)"/>
      <text x="290" y="300" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" font-weight="500">李</text>
      <text x="290" y="336" text-anchor="middle" fill="#7A6558" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11">小李</text>
    </svg>
  </section>

  <!-- Relationship Stats Card -->
  <section style="padding: 0 var(--space-5) var(--space-4);">
    <div style="background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5);">
      <h2 style="font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; color: var(--color-text); margin: 0 0 var(--space-4); line-height: var(--leading-tight);">关系概览</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);">
        <div style="background: var(--color-bg-surface); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); text-align: center;">
          <div style="font-family: var(--font-display); font-size: var(--text-xl); font-weight: 600; color: var(--color-primary); line-height: var(--leading-tight);">6</div>
          <div style="font-size: var(--text-xs); color: var(--color-text-tertiary); margin-top: 2px; font-family: var(--font-body);">总人数</div>
        </div>
        <div style="background: var(--color-bg-surface); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); text-align: center;">
          <div style="font-family: var(--font-display); font-size: var(--text-xl); font-weight: 600; color: var(--color-primary); line-height: var(--leading-tight);">2</div>
          <div style="font-size: var(--text-xs); color: var(--color-text-tertiary); margin-top: 2px; font-family: var(--font-body);">家人</div>
        </div>
        <div style="background: var(--color-bg-surface); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); text-align: center;">
          <div style="font-family: var(--font-display); font-size: var(--text-xl); font-weight: 600; color: var(--color-primary); line-height: var(--leading-tight);">2</div>
          <div style="font-size: var(--text-xs); color: var(--color-text-tertiary); margin-top: 2px; font-family: var(--font-body);">朋友</div>
        </div>
        <div style="background: var(--color-bg-surface); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); text-align: center;">
          <div style="font-family: var(--font-display); font-size: var(--text-xl); font-weight: 600; color: var(--color-primary); line-height: var(--leading-tight);">2</div>
          <div style="font-size: var(--text-xs); color: var(--color-text-tertiary); margin-top: 2px; font-family: var(--font-body);">其他</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Bottom Tab Bar (shared partial) -->
  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      height: 56px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--color-bg-card);
      border-top: 1px solid var(--color-border);
      box-shadow: 0 -1px 4px rgba(61, 43, 31, 0.04);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-width: 40px;
      padding: var(--space-1) 0;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s ease;
      color: var(--color-text-tertiary);
      position: relative;
    }

    .tab-item[data-active="true"] {
      color: var(--color-primary);
    }

    .tab-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .tab-item[data-active="true"] svg {
      stroke: var(--color-primary);
    }

    .tab-label {
      font-family: var(--font-body);
      font-size: 0.5625rem;
      line-height: 1;
      letter-spacing: var(--tracking-wide);
      white-space: nowrap;
    }

    .tab-item::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 14px;
      height: 2px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-item[data-active="true"]::after {
      transform: translateX(-50%) scaleX(1);
    }

.graph-node { cursor: pointer; transition: filter 0.2s ease; }
.graph-node:hover { filter: brightness(1.1) drop-shadow(0 0 6px rgba(196, 120, 91, 0.3)); }
.graph-center-node { cursor: default; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}
  </style>
