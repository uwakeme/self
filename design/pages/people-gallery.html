<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人物图鉴</title>
    <style id="theme-vars">
:root {
  /* ── Brand Colors — Warm Journal Palette ── */
  --color-primary: #C4785B;
  --color-primary-light: #D99B82;
  --color-primary-lighter: #EBC8B8;
  --color-primary-lightest: #F5E6DD;
  --color-primary-dark: #A65D42;
  --color-primary-darker: #8B4A33;

  --color-bg: #FBF7F3;
  --color-bg-warm: #F7F0E8;
  --color-bg-card: #FFFFFF;
  --color-bg-card-alt: #FDF9F5;
  --color-bg-surface: #F5EDE4;
  --color-bg-overlay: rgba(139, 74, 51, 0.08);

  --color-text: #3D2B1F;
  --color-text-secondary: #7A6558;
  --color-text-tertiary: #A89585;
  --color-text-inverse: #FFFFFF;

  --color-border: #E8DDD3;
  --color-border-light: #F0E8DF;
  --color-divider: #EDE5DC;

  /* ── State Colors ── */
  --state-success: #6B9E78;
  --state-warning: #D4A24E;
  --state-error: #C45B5B;
  --state-info: #6B8EAE;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography ── */
  --font-display: 'Georgia', 'Noto Serif SC', serif;
  --font-body: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  --text-xs: 0.6875rem;
  --text-sm: 0.8125rem;
  --text-base: 0.9375rem;
  --text-lg: 1.0625rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;

  --leading-tight: 1.3;
  --leading-normal: 1.6;
  --leading-relaxed: 1.75;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ── Shadows (restrained) ── */
  --shadow-sm: 0 1px 2px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.05);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.05);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-bg);
    --color-foreground: var(--color-text);
    --color-border: var(--color-border);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-text-inverse);
    --color-muted: var(--color-bg-surface);
    --color-muted-foreground: var(--color-text-secondary);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen antialiased" style="max-width: 375px; margin: 0 auto; padding-bottom: 80px; background: var(--color-bg); color: var(--color-text);">

    <!-- Header Banner -->
    <header class="header-banner">
        <h1 style="font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 600; color: var(--color-text); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); margin: 0 0 var(--space-1); text-wrap: balance; word-break: keep-all;">人物图鉴</h1>
        <p style="font-size: var(--text-sm); color: var(--color-text-secondary); margin: 0; letter-spacing: var(--tracking-wide);">记录每一个重要的人</p>
        <!-- Decorative illustration integrated into header -->
        <div style="position: relative; margin-top: var(--space-4); border-radius: var(--radius-md); overflow: hidden; aspect-ratio: 16/7;">
            <img src="../assets/people-collage.jpg" alt="人物图鉴" style="width: 100%; height: 100%; object-fit: cover; display: block;">
            <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(247,240,232,0) 0%, rgba(247,240,232,0.7) 55%, rgba(251,247,243,1) 100%);"></div>
            <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: var(--space-3) var(--space-4); z-index: 1;">
                <p style="font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; color: var(--color-text); margin: 0 0 2px; line-height: var(--leading-tight);">每一段相遇，都值得被记住</p>
                <p style="font-size: var(--text-xs); color: var(--color-text-secondary); margin: 0;">记录你认识的人，探索人与人之间的联结</p>
            </div>
        </div>
    </header>

    <main style="padding: 0 var(--space-4);">

        <!-- Search Bar -->
        <section style="margin-top: calc(-1 * var(--space-4)); position: relative; z-index: 2; margin-bottom: var(--space-4);">
            <div class="search-card">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-text-tertiary); flex-shrink: 0;">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" placeholder="搜索人物..." aria-label="搜索人物">
            </div>
        </section>

        <!-- Filter Pills -->
        <section style="margin-bottom: var(--space-4);">
            <div class="filter-row no-scrollbar">
                <button class="filter-pill filter-pill--active" data-filter="all">全部</button>
                <button class="filter-pill filter-pill--default" data-filter="family">家人</button>
                <button class="filter-pill filter-pill--default" data-filter="friend">朋友</button>
                <button class="filter-pill filter-pill--default" data-filter="colleague">同事</button>
                <button class="filter-pill filter-pill--default" data-filter="classmate">同学</button>
            </div>
        </section>

        <!-- People Card Grid -->
        <section>
            <div class="people-grid">

                <!-- Card 1: 妈妈 -->
                <article class="person-card" data-dom-id="view-person-detail" tabindex="0" role="button" aria-label="查看妈妈详情">
                    <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3);">
                        <div class="avatar-circle avatar--primary">妈</div>
                        <div style="min-width: 0;">
                            <div style="font-weight: 600; font-size: var(--text-base); color: var(--color-text); line-height: 1.3; margin-bottom: 2px;">妈妈</div>
                            <div style="display: flex; align-items: center; gap: var(--space-2);">
                                <span class="mbti-badge">ISFJ</span>
                                <span class="blood-type">A型</span>
                            </div>
                        </div>
                    </div>
                    <span class="rel-tag rel-tag--family">家人</span>
                </article>

                <!-- Card 2: 小林 -->
                <article class="person-card" data-dom-id="view-person-detail" tabindex="0" role="button" aria-label="查看小林详情">
                    <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3);">
                        <div class="avatar-circle avatar--primary-light">林</div>
                        <div style="min-width: 0;">
                            <div style="font-weight: 600; font-size: var(--text-base); color: var(--color-text); line-height: 1.3; margin-bottom: 2px;">小林</div>
                            <div style="display: flex; align-items: center; gap: var(--space-2);">
                                <span class="mbti-badge">ENFP</span>
                                <span class="blood-type">B型</span>
                            </div>
                        </div>
                    </div>
                    <span class="rel-tag rel-tag--friend">朋友</span>
                </article>

                <!-- Card 3: 张老师 -->
                <article class="person-card" data-dom-id="view-person-detail" tabindex="0" role="button" aria-label="查看张老师详情">
                    <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3);">
                        <div class="avatar-circle avatar--success">张</div>
                        <div style="min-width: 0;">
                            <div style="font-weight: 600; font-size: var(--text-base); color: var(--color-text); line-height: 1.3; margin-bottom: 2px;">张老师</div>
                            <div style="display: flex; align-items: center; gap: var(--space-2);">
                                <span class="mbti-badge">INTJ</span>
                                <span class="blood-type">O型</span>
                            </div>
                        </div>
                    </div>
                    <span class="rel-tag rel-tag--colleague">同事</span>
                </article>

                <!-- Card 4: 阿杰 -->
                <article class="person-card" data-dom-id="view-person-detail" tabindex="0" role="button" aria-label="查看阿杰详情">
                    <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3);">
                        <div class="avatar-circle avatar--info">杰</div>
                        <div style="min-width: 0;">
                            <div style="font-weight: 600; font-size: var(--text-base); color: var(--color-text); line-height: 1.3; margin-bottom: 2px;">阿杰</div>
                            <div style="display: flex; align-items: center; gap: var(--space-2);">
                                <span class="mbti-badge">ESTP</span>
                                <span class="blood-type">AB型</span>
                            </div>
                        </div>
                    </div>
                    <span class="rel-tag rel-tag--friend">朋友</span>
                </article>

                <!-- Card 5: 姐姐 -->
                <article class="person-card" data-dom-id="view-person-detail" tabindex="0" role="button" aria-label="查看姐姐详情">
                    <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3);">
                        <div class="avatar-circle avatar--warning">姐</div>
                        <div style="min-width: 0;">
                            <div style="font-weight: 600; font-size: var(--text-base); color: var(--color-text); line-height: 1.3; margin-bottom: 2px;">姐姐</div>
                            <div style="display: flex; align-items: center; gap: var(--space-2);">
                                <span class="mbti-badge">INFJ</span>
                                <span class="blood-type">A型</span>
                            </div>
                        </div>
                    </div>
                    <span class="rel-tag rel-tag--family">家人</span>
                </article>

                <!-- Card 6: 小李 -->
                <article class="person-card" data-dom-id="view-person-detail" tabindex="0" role="button" aria-label="查看小李详情">
                    <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3);">
                        <div class="avatar-circle avatar--primary-dark">李</div>
                        <div style="min-width: 0;">
                            <div style="font-weight: 600; font-size: var(--text-base); color: var(--color-text); line-height: 1.3; margin-bottom: 2px;">小李</div>
                            <div style="display: flex; align-items: center; gap: var(--space-2);">
                                <span class="mbti-badge">INFP</span>
                                <span class="blood-type">O型</span>
                            </div>
                        </div>
                    </div>
                    <span class="rel-tag rel-tag--classmate">同学</span>
                </article>

            </div>
        </section>

    </main>

    <!-- Floating Action Button -->
    <button class="fab" aria-label="添加人物" data-dom-id="add-person">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
    </button>

    <!-- Bottom Tab Bar (shared partial) -->
    <style>
      .tab-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-4);
        height: 56px;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        background: var(--color-bg-card);
        border-top: 1px solid var(--color-border);
        box-shadow: 0 -1px 4px rgba(61, 43, 31, 0.04);
      }

      .tab-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        min-width: 40px;
        padding: var(--space-1) 0;
        text-decoration: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: color 0.2s ease;
        color: var(--color-text-tertiary);
        position: relative;
      }

      .tab-item[data-active="true"] {
        color: var(--color-primary);
      }

      .tab-item svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      .tab-item[data-active="true"] svg {
        stroke: var(--color-primary);
      }

      .tab-label {
        font-family: var(--font-body);
        font-size: 0.5625rem;
        line-height: 1;
        letter-spacing: var(--tracking-wide);
        white-space: nowrap;
      }

      .tab-item::after {
        content: '';
        position: absolute;
        bottom: 2px;
        left: 50%;
        transform: translateX(-50%) scaleX(0);
        width: 14px;
        height: 2px;
        border-radius: var(--radius-full);
        background: var(--color-primary);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .tab-item[data-active="true"]::after {
        transform: translateX(-50%) scaleX(1);
      }
    </style>

    <nav class="tab-bar" role="tablist" aria-label="主导航">
      <a class="tab-item" href="self-profile.html" role="tab" data-dom-id="tab-home" data-tab-key="self-profile" data-active="false" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="tab-label">首页</span>
      </a>
      <a class="tab-item" href="self-detail.html" role="tab" data-dom-id="tab-self-detail" data-tab-key="self-detail" data-active="false" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        <span class="tab-label">我的档案</span>
      </a>
      <a class="tab-item" href="people-gallery.html" role="tab" data-dom-id="tab-people" data-tab-key="people-gallery" data-active="true" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><path d="M2 20v-1a5 5 0 0 1 5-5h2"/><circle cx="17" cy="7" r="3"/><path d="M22 20v-1a5 5 0 0 0-5-5h-2"/></svg>
        <span class="tab-label">人物图鉴</span>
      </a>
      <a class="tab-item" href="relationship-map.html" role="tab" data-dom-id="tab-relationship" data-tab-key="relationship-map" data-active="false" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><line x1="10.5" y1="11" x2="6.5" y2="7"/><line x1="13.5" y1="11" x2="17.5" y2="7"/><line x1="10.5" y1="13" x2="6.5" y2="17"/><line x1="13.5" y1="13" x2="17.5" y2="17"/></svg>
        <span class="tab-label">关系图谱</span>

      <a class="tab-item" href="settings.html" role="tab" data-dom-id="tab-settings" data-tab-key="settings" data-active="false" aria-selected="false">

        <span class="tab-label">设置</span>

    <style>
      /* ── Page Reset & Base ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font-body);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        color: var(--color-text);
        background: var(--color-bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* ── Header Banner ── */
      .header-banner {
        position: relative;
        overflow: hidden;
        background: var(--color-bg-warm);
        padding: var(--space-6) var(--space-5) var(--space-8);
        text-align: center;
      }
      .header-banner::before {
        content: '';
        position: absolute;
        inset: 0;
        background: url('../assets/people-collage.jpg') center/cover no-repeat;
        opacity: 0.25;
        pointer-events: none;
      }
      .header-banner::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, var(--color-bg-warm) 0%, rgba(247,240,232,0.3) 100%);
        pointer-events: none;
      }
      .header-banner > * {
        position: relative;
        z-index: 1;
      }

      /* ── Search Bar ── */
      .search-card {
        background: var(--color-bg-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        padding: var(--space-3) var(--space-4);
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }
      .search-card input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-family: var(--font-body);
        font-size: var(--text-sm);
        color: var(--color-text);
        line-height: 1.5;
      }
      .search-card input::placeholder {
        color: var(--color-text-tertiary);
      }

      /* ── Filter Pills ── */
      .filter-row {
        display: flex;
        gap: var(--space-2);
        overflow-x: auto;
        padding-bottom: var(--space-1);
      }
      .filter-pill {
        flex-shrink: 0;
        padding: var(--space-1) var(--space-4);
        border-radius: var(--radius-full);
        font-size: var(--text-sm);
        font-family: var(--font-body);
        line-height: 1.5;
        cursor: pointer;
        border: none;
        transition: background-color 0.16s cubic-bezier(0.2, 0.8, 0.2, 1),
                    color 0.16s cubic-bezier(0.2, 0.8, 0.2, 1);
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
      }
      .filter-pill--active {
        background: var(--color-primary);
        color: var(--color-text-inverse);
      }
      .filter-pill--default {
        background: var(--color-primary-lightest);
        color: var(--color-text-secondary);
      }
      .filter-pill--default:hover {
        background: var(--color-bg-surface);
      }

      /* ── People Card Grid ── */
      .people-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-3);
      }

      /* ── Person Card ── */
      .person-card {
        background: var(--color-bg-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--space-4);
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1),
                    box-shadow 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        -webkit-tap-highlight-color: transparent;
      }
      .person-card:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }
      .person-card:active {
        transform: translateY(0);
      }

      /* ── Avatar Circle ── */
      .avatar-circle {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-full);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: var(--text-lg);
        font-weight: 600;
        color: var(--color-text-inverse);
        flex-shrink: 0;
      }

      /* ── MBTI Badge ── */
      .mbti-badge {
        display: inline-block;
        padding: 2px var(--space-2);
        border-radius: var(--radius-full);
        font-size: var(--text-xs);
        font-weight: 500;
        letter-spacing: var(--tracking-wide);
        background: var(--color-primary-lightest);
        color: var(--color-primary-dark);
      }

      /* ── Blood Type ── */
      .blood-type {
        font-size: var(--text-xs);
        color: var(--color-text-tertiary);
        font-weight: 500;
      }

      /* ── Relationship Tag ── */
      .rel-tag {
        display: inline-block;
        padding: 2px var(--space-2);
        border-radius: var(--radius-full);
        font-size: var(--text-xs);
        font-weight: 500;
      }

      /* ── FAB ── */
      .fab {
        position: fixed;
        bottom: 76px;
        right: 20px;
        width: 48px;
        height: 48px;
        border-radius: var(--radius-full);
        background: var(--color-primary);
        color: var(--color-text-inverse);
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(196, 120, 91, 0.25);
        transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1),
                    box-shadow 0.16s cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 50;
        -webkit-tap-highlight-color: transparent;
      }
      .fab:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(196, 120, 91, 0.3);
      }
      .fab:active {
        transform: scale(0.96);
      }

      /* ── Avatar Color Variations ── */
      .avatar--primary { background: var(--color-primary); }
      .avatar--primary-light { background: var(--color-primary-light); }
      .avatar--success { background: var(--state-success); }
      .avatar--info { background: var(--state-info); }
      .avatar--warning { background: var(--state-warning); }
      .avatar--primary-dark { background: var(--color-primary-dark); }

      /* ── Relationship Tag Muted Warm Colors ── */
      .rel-tag--family {
        background: rgba(196, 120, 91, 0.1);
        color: var(--color-primary-dark);
      }
      .rel-tag--friend {
        background: rgba(107, 142, 174, 0.1);
        color: var(--state-info);
      }
      .rel-tag--colleague {
        background: rgba(107, 158, 120, 0.1);
        color: var(--state-success);
      }
      .rel-tag--classmate {
        background: rgba(212, 162, 78, 0.1);
        color: var(--state-warning);
      }

      @media (prefers-reduced-motion: reduce) {
        .person-card,
        .filter-pill,
        .fab {
          transition-duration: 0.01ms;
        }
      }

button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}
    </style>

    <script>
      // Filter pill toggle
      document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('.filter-pill').forEach(p => {
            p.classList.remove('filter-pill--active');
            p.classList.add('filter-pill--default');
          });
          pill.classList.remove('filter-pill--default');
          pill.classList.add('filter-pill--active');
        });
      });
    </script>
</body>
</html>
